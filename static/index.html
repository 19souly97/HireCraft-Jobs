<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hirecraft Jobs</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--navy:#0b1530;--blue:#2563eb;--bg:#f4f6fb;--mut:#64748b;--line:#dbe2ef}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--navy);font:16px/1.45 "Segoe UI",Roboto,Helvetica,Arial,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{background:#fff;text-align:center;padding:10px 0 0}
header img{height:92px}
nav{display:flex;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:2}
nav button{flex:1;padding:14px;border:0;background:none;font:600 15px inherit;color:var(--mut);border-bottom:3px solid transparent}
nav button.on{color:var(--blue);border-color:var(--blue)}
main{padding:16px;max-width:640px;margin:auto}
input,textarea{width:100%;padding:12px;margin:0 0 12px;border:1px solid var(--line);border-radius:10px;font:inherit;background:#fff;color:var(--navy)}
input:focus,textarea:focus,button:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
label{display:block;font-weight:600;font-size:14px;margin-bottom:4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
.card h3{margin:10px 0 0;font-size:18px}
.sk{color:var(--blue);font-weight:600;margin:2px 0 8px}
.ph,.prev{display:flex;gap:6px;overflow-x:auto}
.ph img,.prev img{height:130px;border-radius:10px;object-fit:cover}
.row{display:flex;justify-content:space-between;align-items:center}
.btn,.card button{background:var(--blue);color:#fff;border:0;border-radius:10px;padding:11px 22px;font:600 15px inherit}
.btn{width:100%;margin-top:6px}
.mut{color:var(--mut);text-align:center}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:10px;opacity:0;transition:opacity .2s;pointer-events:none}
</style>
</head>
<body>
<header><img src="/static/logo.png" alt="Hirecraft Jobs"></header>
<nav><button id="t1" class="on">Find talent</button><button id="t2">My profile</button></nav>

<main id="find">
  <input id="q" type="search" placeholder="Search a skill, e.g. electrician, designer">
  <div id="list"></div>
</main>

<main id="me" hidden>
  <label for="name">Full name</label><input id="name">
  <label for="skill">Your skill</label><input id="skill" placeholder="e.g. Welder, Photographer, Accountant">
  <div class="two">
    <div><label for="years">Years of experience</label><input id="years" type="number" min="0"></div>
    <div><label for="rate">Rate</label><input id="rate" placeholder="e.g. 500 ETB/day"></div>
  </div>
  <label for="location">Location</label><input id="location">
  <label for="bio">Experience and past work</label><textarea id="bio" rows="5" placeholder="Where you've worked, what you've built, tools you use"></textarea>
  <label for="pics">Professional photos (up to 4)</label>
  <input id="pics" type="file" accept="image/*" multiple>
  <div class="prev" id="prev"></div>
  <button class="btn" id="save">Save profile</button>
</main>
<div id="toast"></div>

<script>
const tg=Telegram.WebApp;tg.ready();tg.expand();
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let photos=[];

async function api(path,body){
  const r=await fetch(path,{method:body?'POST':'GET',headers:{'Content-Type':'application/json','X-Init-Data':tg.initData},body:body&&JSON.stringify(body)});
  const d=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(d.error||'Something went wrong');
  return d;
}
function toast(m){const t=$('#toast');t.textContent=m;t.style.opacity=1;setTimeout(()=>t.style.opacity=0,2500)}
function tab(n){$('#find').hidden=n!=1;$('#me').hidden=n!=2;$('#t1').classList.toggle('on',n==1);$('#t2').classList.toggle('on',n==2)}
$('#t1').onclick=()=>{tab(1);load()};$('#t2').onclick=()=>tab(2);

async function load(){
  try{
    const d=await api('/api/profiles?q='+encodeURIComponent($('#q').value));
    $('#list').innerHTML=d.length?d.map(p=>`<div class="card">
      <div class="ph">${p.photos.map(u=>`<img src="${u}" alt="">`).join('')}</div>
      <h3>${esc(p.name)}</h3>
      <p class="sk">${esc(p.skill)}, ${esc(p.years)} yrs, ${esc(p.location)}</p>
      <p>${esc(p.bio)}</p>
      <div class="row"><b>${esc(p.rate)}</b><button data-id="${p.id}">Hire</button></div></div>`).join('')
      :'<p class="mut">No matching profiles yet. Try another skill.</p>';
  }catch(e){toast(e.message)}
}
$('#q').oninput=()=>{clearTimeout(window._t);window._t=setTimeout(load,300)};
$('#list').onclick=e=>{
  const id=e.target.dataset.id;if(!id)return;
  tg.showConfirm('Send a hire request to this person?',async ok=>{
    if(!ok)return;
    try{await api('/api/hire',{id});toast('Hire request sent')}catch(err){toast(err.message)}
  });
};

function shrink(f){return new Promise(res=>{const i=new Image();i.onload=()=>{
  const s=Math.min(1,480/Math.max(i.width,i.height)),c=document.createElement('canvas');
  c.width=i.width*s;c.height=i.height*s;c.getContext('2d').drawImage(i,0,0,c.width,c.height);
  res(c.toDataURL('image/jpeg',.75))};i.src=URL.createObjectURL(f)})}
const showPrev=()=>$('#prev').innerHTML=photos.map(u=>`<img src="${u}" alt="">`).join('');
$('#pics').onchange=async e=>{photos=[];for(const f of [...e.target.files].slice(0,4))photos.push(await shrink(f));showPrev()};

const F=['name','skill','years','location','rate','bio'];
$('#save').onclick=async()=>{
  const b={photos};F.forEach(k=>b[k]=$('#'+k).value.trim());
  try{await api('/api/profile',b);toast('Profile saved')}catch(e){toast(e.message)}
};
(async()=>{
  try{const m=await api('/api/me');F.forEach(k=>$('#'+k).value=m[k]??'');photos=m.photos||[];showPrev()}catch(e){}
  load();
})();
</script>
</body>
</html>
